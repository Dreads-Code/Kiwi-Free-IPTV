[package]
name = "iptv-nz-addon-rust"
version = "1.7.1"
edition = "2024"
description = "A high-performance, unified solution for streaming free-to-air New Zealand TV"
repository = "https://github.com/Dreads-Code/Kiwi-Free-IPTV"
license = "MIT"

[lib]
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "axum"
path = "api/axum.rs"
required-features = ["native"]

[[bin]]
name = "local"
path = "src/local.rs"
required-features = ["native"]

[features]
default = ["native"]
native = ["vercel_runtime", "tokio", "axum", "tower", "tower-http", "moka"]

[dependencies]
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1.0.151"
reqwest = { version = "0.13.4", features = ["json", "stream"] }
quick-xml = { version = "0.41.0", features = ["serialize"] }
m3u8-rs = "6.0.1"
chrono = { version = "0.4.45", features = ["serde"] }
log = "0.4.34"
env_logger = "0.11.11"
semver = "1.0.28"
url = "2.5.8"
stremio-core = { git = "https://github.com/stremio/stremio-core", features = ["derive"] }
urlencoding = "2.1.3"
regex = "1.13.1"
futures = "0.3.34"
base64 = "0.22.1"

# WASM Dependencies
wasm-bindgen = "0.2.127"
js-sys = "0.3.104"
web-sys = { version = "0.3.104", features = [
  "Headers",
  "Request",
  "RequestInit",
  "RequestMode",
  "Response",
  "Window",
  "console",
] }
getrandom = { version = "0.4.2", features = ["wasm_js"] }
serde-wasm-bindgen = "0.6.5"
console_error_panic_hook = "0.1.7"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
vercel_runtime = { version = "2.3.0", features = ["axum"], optional = true }
tokio = { version = "1.53.1", features = ["full"], optional = true }
axum = { version = "0.8.9", optional = true }
tower = { version = "0.5.3", features = ["util"], optional = true }
tower-http = { version = "0.6.11", features = ["cors"], optional = true }
moka = { version = "0.12.16", features = ["future"], optional = true }

[dev-dependencies]
mockito = "1.7.2"
http-body-util = "0.1.5"
wasm-bindgen-test = "0.3.77"
urlencoding = "2.1.3"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
