[package]
name = "iptv-nz-addon-rust"
version = "1.5.0"
edition = "2024"

[lib]
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "axum"
path = "api/axum.rs"
required-features = ["native"]

[[bin]]
name = "local"
path = "src/local.rs"
required-features = ["native"]

[features]
default = ["native"]
native = ["vercel_runtime", "tokio", "axum", "tower", "tower-http", "moka"]

[dependencies]
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
reqwest = { version = "0.13", features = ["json", "stream"] }
quick-xml = { version = "0.39", features = ["serialize"] }
m3u8-rs = "6.0.0"
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
env_logger = "0.11"
semver = "1.0"
url = "2.5"
stremio-core = { git = "https://github.com/stremio/stremio-core", features = ["derive"] }
urlencoding = "2.1.3"
regex = "1.12.3"
futures = "0.3"
base64 = "0.22"

# WASM Dependencies
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Headers", "Request", "RequestInit", "RequestMode", "Response", "Window", "console"] }
getrandom = { version = "0.4", features = ["wasm_js"] }
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
vercel_runtime = { version = "2", features = ["axum"], optional = true }
tokio = { version = "1", features = ["full"], optional = true }
axum = { version = "0.8", optional = true }
tower = { version = "0.5", features = ["util"], optional = true }
tower-http = { version = "0.6", features = ["cors"], optional = true }
moka = { version = "0.12", features = ["future"], optional = true }

[dev-dependencies]
mockito = "1.7"
http-body-util = "0.1"
wasm-bindgen-test = "0.3"
urlencoding = "2.1"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
