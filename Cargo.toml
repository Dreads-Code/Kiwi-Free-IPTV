[package]
name = "iptv-nz-addon-rust"
version = "1.0.0"
edition = "2024"

[lib]
path = "src/lib.rs"

[[bin]]
name = "axum"
path = "api/axum.rs"

[[bin]]
name = "local"
path = "src/local.rs"

[dependencies]
vercel_runtime = { version = "2", features = ["axum"] }
tokio = { version = "1", features = ["full"] }
hyper = { version = "1", features = ["full"] }
axum = { version = "0.8" }
axum-streams = { version = "0.24", features = ["json", "text"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["json", "rustls-tls-native-roots", "stream"] }
quick-xml = { version = "0.36", features = ["serialize"] }
m3u8-rs = "6.0.0"
moka = { version = "0.12", features = ["future"] }
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
env_logger = "0.11"
semver = "1.0"
url = "2.5"
stremio-core = { git = "https://github.com/stremio/stremio-core", features = ["derive"] }
urlencoding = "2.1.3"
regex = "1.12.3"
futures = "0.3"
base64 = "0.22"

[dev-dependencies]
mockito = "1.5"
http-body-util = "0.1"



[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
